<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VBAL Field Scanner</title>
    <!-- Use CDN for Socket.IO, but graceful fallback if offline (user must have it cached or we rely on just upload) -->
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <style>
        body {
            background-color: #05080b;
            color: #e6edf3;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: 2px;
            color: #00f2ff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
            margin-top: 1rem;
        }
        .scanner-frame {
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            position: relative;
            background: rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .scanner-frame::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 2px solid transparent;
            border-top: 2px solid #00f2ff;
            border-bottom: 2px solid #00f2ff;
            animation: scan 3s infinite linear;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes scan {
            0% { transform: scaleX(0.9); opacity: 0.5; }
            50% { transform: scaleX(1); opacity: 1; }
            100% { transform: scaleX(0.9); opacity: 0.5; }
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-btn {
            background-color: #00f2ff;
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            transition: transform 0.2s;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
        .upload-btn:active {
            transform: scale(0.95);
        }
        .status {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #8b949e;
            text-align: center;
            height: 20px;
        }
        
        #live-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Hidden until data flows */
        }
        
        .mode-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            color: #fff;
            border: 1px solid #333;
            z-index: 20;
        }
        
        .connection-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            margin-right: 5px;
        }
        .connected .connection-dot {
            background: #2ecc71;
            box-shadow: 0 0 5px #2ecc71;
        }
    </style>
</head>
<body>
    <div class="mode-indicator" id="connection-status">
        <span class="connection-dot"></span> OFFLINE
    </div>

    <h1>VBAL LIVE LINK</h1>
    
    <div class="scanner-frame">
        <svg id="placeholder-icon" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: rgba(255,255,255,0.2)"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <img id="live-feed" src="" alt="Live Feed" />
    </div>

    <label class="upload-btn">
        CAPTURE TERRAIN
        <input type="file" accept="image/*" capture="environment" onchange="uploadImage(this)">
    </label>

    <div class="status" id="status">WAITING FOR DATA STREAM...</div>

    <script>
        // Connect to the same host that served this page
        const socket = io();
        const feedImg = document.getElementById('live-feed');
        const placeholder = document.getElementById('placeholder-icon');
        const statusText = document.getElementById('status');
        const connStatus = document.getElementById('connection-status');
        
        socket.on('connect', () => {
            console.log("Connected to Uplink");
            connStatus.innerHTML = '<span class="connection-dot"></span> CONNECTED';
            connStatus.classList.add('connected');
            statusText.textContent = "LINK ESTABLISHED - LISTENING";
        });
        
        socket.on('disconnect', () => {
            connStatus.innerHTML = '<span class="connection-dot"></span> DISCONNECTED';
            connStatus.classList.remove('connected');
        });

        socket.on('terrain_update', (data) => {
            // Received new data
            if (data && data.visuals && data.visuals.original_gray) {
                feedImg.src = `data:image/jpeg;base64,${data.visuals.original_gray}`;
                feedImg.style.display = 'block';
                placeholder.style.display = 'none';
                
                if (data.is_video_frame) {
                    statusText.textContent = "RECEIVING LIVE VIDEO FEED";
                    statusText.style.color = "#00f2ff";
                } else {
                    statusText.textContent = "NEW UPLOAD RECEIVED";
                    statusText.style.color = "#2ecc71";
                }
            }
        });

        async function uploadImage(input) {
            if (input.files && input.files[0]) {
                statusText.textContent = "TRANSMITTING DATA...";
                statusText.style.color = "#00f2ff";
                
                const formData = new FormData();
                formData.append('image', input.files[0]);
                
                try {
                    const response = await fetch('/upload_mobile', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        statusText.textContent = "UPLOAD COMPLETE";
                        // The socket event will update the image shortly
                    } else {
                        statusText.textContent = "TRANSMISSION FAILED";
                        statusText.style.color = "#ff4d4d";
                    }
                } catch (e) {
                    statusText.textContent = "ERROR: " + e.message;
                    statusText.style.color = "#ff4d4d";
                }
            }
        }
    </script>
</body>
</html>
